name: run
on:
  workflow_dispatch:
    inputs:
      sources:
        description: "이 소스만(쉼표, 예: ttang,onlinetour). 비우면 전부"
        required: false
        default: ""
permissions:
  contents: write
jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {s: ttang, p: "theme", t: p-ttang-theme}
          - {s: ttang, p: "list@0/12", t: p-ttang-list-0of12}
          - {s: ttang, p: "list@1/12", t: p-ttang-list-1of12}
          - {s: ttang, p: "list@2/12", t: p-ttang-list-2of12}
          - {s: ttang, p: "list@3/12", t: p-ttang-list-3of12}
          - {s: ttang, p: "list@4/12", t: p-ttang-list-4of12}
          - {s: ttang, p: "list@5/12", t: p-ttang-list-5of12}
          - {s: ttang, p: "list@6/12", t: p-ttang-list-6of12}
          - {s: ttang, p: "list@7/12", t: p-ttang-list-7of12}
          - {s: ttang, p: "list@8/12", t: p-ttang-list-8of12}
          - {s: ttang, p: "list@9/12", t: p-ttang-list-9of12}
          - {s: ttang, p: "list@10/12", t: p-ttang-list-10of12}
          - {s: ttang, p: "list@11/12", t: p-ttang-list-11of12}
          - {s: modetour, p: "0/16", t: p-modetour-0of16}
          - {s: modetour, p: "1/16", t: p-modetour-1of16}
          - {s: modetour, p: "2/16", t: p-modetour-2of16}
          - {s: modetour, p: "3/16", t: p-modetour-3of16}
          - {s: modetour, p: "4/16", t: p-modetour-4of16}
          - {s: modetour, p: "5/16", t: p-modetour-5of16}
          - {s: modetour, p: "6/16", t: p-modetour-6of16}
          - {s: modetour, p: "7/16", t: p-modetour-7of16}
          - {s: modetour, p: "8/16", t: p-modetour-8of16}
          - {s: modetour, p: "9/16", t: p-modetour-9of16}
          - {s: modetour, p: "10/16", t: p-modetour-10of16}
          - {s: modetour, p: "11/16", t: p-modetour-11of16}
          - {s: modetour, p: "12/16", t: p-modetour-12of16}
          - {s: modetour, p: "13/16", t: p-modetour-13of16}
          - {s: modetour, p: "14/16", t: p-modetour-14of16}
          - {s: modetour, p: "15/16", t: p-modetour-15of16}
          - {s: ybtour, p: "PKG@0/3", t: p-ybtour-PKG-0of3}
          - {s: ybtour, p: "PKG@1/3", t: p-ybtour-PKG-1of3}
          - {s: ybtour, p: "PKG@2/3", t: p-ybtour-PKG-2of3}
          - {s: ybtour, p: "HYM", t: p-ybtour-HYM}
          - {s: ybtour, p: "FIT", t: p-ybtour-FIT}
          - {s: ybtour, p: "DMT", t: p-ybtour-DMT}
          - {s: ybtour, p: "GLF+CRS+YBP", t: p-ybtour-GLF_CRS_YBP}
          - {s: onlinetour, p: "wc", t: p-onlinetour-wc}
          - {s: onlinetour, p: "wd", t: p-onlinetour-wd}
          - {s: onlinetour, p: "wf", t: p-onlinetour-wf}
          - {s: onlinetour, p: "wm", t: p-onlinetour-wm}
          - {s: onlinetour, p: "wk", t: p-onlinetour-wk}
          - {s: hanatour, p: "FP@0/12", t: p-hanatour-FP-0of12}
          - {s: hanatour, p: "FP@1/12", t: p-hanatour-FP-1of12}
          - {s: hanatour, p: "FP@2/12", t: p-hanatour-FP-2of12}
          - {s: hanatour, p: "FP@3/12", t: p-hanatour-FP-3of12}
          - {s: hanatour, p: "FP@4/12", t: p-hanatour-FP-4of12}
          - {s: hanatour, p: "FP@5/12", t: p-hanatour-FP-5of12}
          - {s: hanatour, p: "FP@6/12", t: p-hanatour-FP-6of12}
          - {s: hanatour, p: "FP@7/12", t: p-hanatour-FP-7of12}
          - {s: hanatour, p: "FP@8/12", t: p-hanatour-FP-8of12}
          - {s: hanatour, p: "FP@9/12", t: p-hanatour-FP-9of12}
          - {s: hanatour, p: "FP@10/12", t: p-hanatour-FP-10of12}
          - {s: hanatour, p: "FP@11/12", t: p-hanatour-FP-11of12}
          - {s: hanatour, p: "HM", t: p-hanatour-HM}
          - {s: hanatour, p: "CP", t: p-hanatour-CP}
          - {s: hanatour, p: "FF@0/4", t: p-hanatour-FF-0of4}
          - {s: hanatour, p: "FF@1/4", t: p-hanatour-FF-1of4}
          - {s: hanatour, p: "FF@2/4", t: p-hanatour-FF-2of4}
          - {s: hanatour, p: "FF@3/4", t: p-hanatour-FF-3of4}
          - {s: hanatour, p: "FG@0/3", t: p-hanatour-FG-0of3}
          - {s: hanatour, p: "FG@1/3", t: p-hanatour-FG-1of3}
          - {s: hanatour, p: "FG@2/3", t: p-hanatour-FG-2of3}
          - {s: hanatour, p: "DG", t: p-hanatour-DG}
          - {s: hanatour, p: "FCR", t: p-hanatour-FCR}
          - {s: hanatour, p: "FTK", t: p-hanatour-FTK}
          - {s: hanatour, p: "ZE", t: p-hanatour-ZE}
          - {s: hanatour, p: "DP", t: p-hanatour-DP}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      K: ${{ secrets.K }}
      # 2026-10-05: 실패한 소스만 다시(services/packages.gh_dispatch(sources)) -- 해당 없는 작업은 단계를 다 건너뛰고 바로 끝난다
      RUN: ${{ inputs.sources == '' || contains(format(',{0},', inputs.sources), format(',{0},', matrix.s)) }}
    steps:
      - uses: actions/checkout@v4
        if: env.RUN == 'true'
      - if: env.RUN == 'true'
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:K -in a.bin -out a.tgz
          tar xzf a.tgz
          pip install -q httpx python-dotenv
          python3 run.py ${{ matrix.s }} "${{ matrix.p }}" out.gz
      - if: env.RUN == 'true'
        run: openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:K -in out.gz -out data.bin
      - if: env.RUN == 'true'
        run: |
          gh release view ${{ matrix.t }} >/dev/null 2>&1 || gh release create ${{ matrix.t }} --title ${{ matrix.t }} --notes ""
          gh release upload ${{ matrix.t }} data.bin --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      - if: env.RUN == 'true'
        run: test ! -f failed
